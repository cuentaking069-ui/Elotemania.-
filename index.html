<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elotemanía | Menú Digital</title>

  <meta name="theme-color" content="#d4af37">
  <meta name="description" content="Menú digital de Elotemanía">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
</head>

<body>

  <div class="fondo-logo"></div>

  <header class="header">

    <div class="logo-principal">
      <img src="logo.png" alt="Elotemanía">
    </div>

    <h1>🌽 ELOTEMANÍA</h1>
    <p>Entre compas sabe mejor</p>

  </header>

  <main>

    <section class="pedido">

      <h2>🌽 Haz tu pedido</h2>

      <div id="menu"></div>

    </section>

    <section class="carrito">

      <h2>🛒 Tu pedido</h2>

      <div id="carrito"></div>

      <div class="total">
        <span>Total:</span>
        <strong id="total">$0</strong>
      </div>

    </section>

    <section class="datos">

      <h2>📋 Tus datos</h2>

      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        placeholder="Escribe tu nombre"
      >

      <label for="telefono">Teléfono</label>
      <input
        type="tel"
        id="telefono"
        placeholder="Tu número de teléfono"
      >

      <button
        class="btn-whatsapp"
        onclick="enviarWhatsApp()"
      >
        📲 Enviar pedido por WhatsApp
      </button>

    </section>

  </main>

  <footer>
    <p>🌽 Elotemanía</p>
    <p>Entre compas sabe mejor ❤️‍🔥</p>
  </footer>


<script>

const WHATSAPP = "526143839513";

const productos = [

  {
    id: 1,
    nombre: "Elote en vaso chico",
    precio: 35
  },

  {
    id: 2,
    nombre: "Elote en vaso mediano",
    precio: 40
  },

  {
    id: 3,
    nombre: "Elote en vaso grande",
    precio: 45
  },

  {
    id: 4,
    nombre: "Elote en vaso jumbo",
    precio: 55
  },

  {
    id: 5,
    nombre: "Elote en vaso 1/2 litro",
    precio: 75
  },

  {
    id: 6,
    nombre: "Elote en vaso litro",
    precio: 150
  },

  {
    id: 7,
    nombre: "Elote entero sencillo",
    precio: 45
  },

  {
    id: 8,
    nombre: "Elote entero revolcado",
    precio: 80
  },

  {
    id: 9,
    nombre: "Elote entero especial",
    precio: 90
  },

  {
    id: 10,
    nombre: "Nachos sencillo",
    precio: 70
  },

  {
    id: 11,
    nombre: "Dorinachos especial",
    precio: 80
  },

  {
    id: 12,
    nombre: "Maruchan preparada 1/2 litro",
    precio: 75
  },

  {
    id: 13,
    nombre: "Maruchan preparada litro",
    precio: 100
  },

  {
    id: 14,
    nombre: "Elote chorreado chico",
    precio: 125
  },

  {
    id: 15,
    nombre: "Elote chorreado entero",
    precio: 125
  },

  {
    id: 16,
    nombre: "Elote chorreado grande",
    precio: 160
  },

  {
    id: 17,
    nombre: "Soda 600 ml",
    precio: 30
  }

];


let carrito = {};


function dinero(numero) {

  return "$" + numero.toLocaleString("es-MX");

}


function mostrarMenu() {

  const menu = document.getElementById("menu");

  menu.innerHTML = "";

  productos.forEach(producto => {

    const cantidad = carrito[producto.id] || 0;

    const tarjeta = document.createElement("div");

    tarjeta.className = "producto";

    tarjeta.innerHTML = `

      <div class="producto-info">

        <h3>${producto.nombre}</h3>

        <strong>${dinero(producto.precio)}</strong>

      </div>

      <div class="controles">

        <button onclick="quitar(${producto.id})">
          −
        </button>

        <span>${cantidad}</span>

        <button onclick="agregar(${producto.id})">
          +
        </button>

      </div>

    `;

    menu.appendChild(tarjeta);

  });

}


function agregar(id) {

  carrito[id] = (carrito[id] || 0) + 1;

  actualizar();

}


function quitar(id) {

  if (!carrito[id]) return;

  carrito[id]--;

  if (carrito[id] <= 0) {

    delete carrito[id];

  }

  actualizar();

}


function calcularTotal() {

  let total = 0;

  productos.forEach(producto => {

    const cantidad = carrito[producto.id] || 0;

    total += producto.precio * cantidad;

  });

  return total;

}


function mostrarCarrito() {

  const contenedor = document.getElementById("carrito");

  contenedor.innerHTML = "";

  let hayProductos = false;

  productos.forEach(producto => {

    const cantidad = carrito[producto.id] || 0;

    if (cantidad > 0) {

      hayProductos = true;

      const subtotal = producto.precio * cantidad;

      const item = document.createElement("div");

      item.className = "carrito-item";

      item.innerHTML = `

        <div>

          <strong>${producto.nombre}</strong>

          <small>
            ${cantidad} × ${dinero(producto.precio)}
          </small>

        </div>

        <strong>
          ${dinero(subtotal)}
        </strong>

      `;

      contenedor.appendChild(item);

    }

  });


  if (!hayProductos) {

    contenedor.innerHTML = `
      <p class="vacio">
        Todavía no has agregado productos.
      </p>
    `;

  }

}


function actualizar() {

  mostrarMenu();

  mostrarCarrito();

  document.getElementById("total").textContent =
    dinero(calcularTotal());

}


function enviarWhatsApp() {

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const total = calcularTotal();


  if (!nombre) {

    alert("Escribe tu nombre.");

    return;

  }


  if (!telefono) {

    alert("Escribe tu número de teléfono.");

    return;

  }


  if (total <= 0) {

    alert("Agrega al menos un producto.");

    return;

  }


  let mensaje =
    "🌽 *NUEVO PEDIDO — ELOTEMANÍA*%0A%0A";


  mensaje +=
    "👤 *Nombre:* " +
    encodeURIComponent(nombre) +
    "%0A";


  mensaje +=
    "📱 *Teléfono:* " +
    encodeURIComponent(telefono) +
    "%0A%0A";


  mensaje +=
    "🛒 *PEDIDO:*%0A";


  productos.forEach(producto => {

    const cantidad = carrito[producto.id] || 0;

    if (cantidad > 0) {

      const subtotal =
        producto.precio * cantidad;

      mensaje +=
        "• " +
        cantidad +
        " × " +
        encodeURIComponent(producto.nombre) +
        " — $" +
        subtotal +
        "%0A";

    }

  });


  mensaje +=
    "%0A💰 *TOTAL: $" +
    total +
    "*%0A%0A";


  mensaje +=
    "¡Gracias por comprar en Elotemanía! 🌽❤️";


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    mensaje;


  window.open(url, "_blank");

}


actualizar();


if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("/sw.js")
      .catch(error => {

        console.log(
          "Error registrando Service Worker:",
          error
        );

      });

  });

}

</script>

</body>
</html>
