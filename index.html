<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elotemanía</title>

  <meta name="theme-color" content="#d4af37">
  <meta name="description" content="Menú digital y pedidos de Elotemanía">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .fondo {
      position: fixed;
      inset: 0;
      background: url("/logo.png") center/500px no-repeat;
      opacity: .06;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .logo {
      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #d4af37;
      margin: 10px auto 15px;
      display: block;
      box-shadow: 0 0 25px rgba(212,175,55,.3);
    }

    h1 {
      color: #d4af37;
      margin: 5px 0;
      font-size: 30px;
    }

    .slogan {
      margin-bottom: 25px;
      color: #ddd;
    }

    .instalar {
      border: 2px solid #d4af37;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
      background: #111;
    }

    .instalar h2 {
      color: #d4af37;
      margin-top: 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #btn-instalar {
      background: #d4af37;
      color: #000;
      margin-top: 10px;
    }

    .producto {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 15px;
      margin: 12px 0;
      text-align: left;
    }

    .producto h3 {
      color: #d4af37;
      margin: 0 0 5px;
    }

    .precio {
      color: #fff;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .controles {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .controles button {
      background: #d4af37;
      color: #000;
      min-width: 45px;
    }

    .cantidad {
      font-size: 20px;
      font-weight: bold;
    }

    #carrito {
      margin-top: 25px;
      padding: 20px;
      border: 2px solid #d4af37;
      border-radius: 18px;
      background: #101010;
    }

    #carrito h2 {
      color: #d4af37;
    }

    #lista-carrito {
      text-align: left;
    }

    .total {
      font-size: 25px;
      font-weight: bold;
      color: #d4af37;
      margin: 15px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #555;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
    }

    #btn-whatsapp {
      width: 100%;
      background: #25d366;
      color: white;
      margin-top: 12px;
      font-size: 18px;
    }

    #ios {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #222;
    }
  </style>
</head>

<body>

<div class="fondo"></div>

<main>

  <img src="/logo.png" class="logo" alt="Elotemanía">

  <h1>🌽 ELOTEMANÍA</h1>
  <div class="slogan">Entre compas sabe mejor</div>

  <section class="instalar">
    <h2>📲 Instala Elotemanía</h2>

    <p id="mensaje">
      Ten nuestro menú siempre a la mano.
    </p>

    <button id="btn-instalar" style="display:none;">
      📲 Instalar Elotemanía
    </button>

    <div id="ios">
      🍎 <b>iPhone / iPad</b>
      <br><br>
      Toca <b>Compartir ⬆️</b> y después
      <b>“Añadir a pantalla de inicio”</b>.
    </div>
  </section>

  <h2 style="color:#d4af37;">🌽 Nuestro menú</h2>

  <div id="productos"></div>

  <section id="carrito">

    <h2>🛒 Tu pedido</h2>

    <div id="lista-carrito">
      <p>Aún no has agregado productos.</p>
    </div>

    <div class="total">
      Total: $<span id="total">0</span>
    </div>

    <input id="nombre" type="text" placeholder="Tu nombre">

    <input id="telefono" type="tel" placeholder="Tu teléfono">

    <button id="btn-whatsapp">
      📲 Enviar pedido por WhatsApp
    </button>

  </section>

</main>

<script>

const WHATSAPP = "526143839513";

const productos = [
  ["Elote en vaso chico", 35],
  ["Elote en vaso mediano", 40],
  ["Elote en vaso grande", 45],
  ["Elote en vaso jumbo", 55],
  ["Elote en vaso 1/2 litro", 75],
  ["Elote en vaso litro", 150],
  ["Elote entero sencillo", 45],
  ["Elote entero revolcado", 80],
  ["Elote entero especial", 90],
  ["Nachos sencillo", 70],
  ["Dorinachos especial", 80],
  ["Maruchan preparada 1/2 litro", 75],
  ["Maruchan preparada litro", 100],
  ["Elote chorreado chico", 125],
  ["Elote chorreado entero", 125],
  ["Elote chorreado grande", 160],
  ["Soda 600 ml", 30]
];

const carrito = {};

const contenedor = document.getElementById("productos");

productos.forEach((producto, indice) => {

  const nombre = producto[0];
  const precio = producto[1];

  carrito[indice] = 0;

  const div = document.createElement("div");

  div.className = "producto";

  div.innerHTML = `
    <h3>${nombre}</h3>
    <div class="precio">$${precio}</div>

    <div class="controles">

      <button onclick="cambiarCantidad(${indice}, -1)">−</button>

      <span class="cantidad" id="cantidad-${indice}">0</span>

      <button onclick="cambiarCantidad(${indice}, 1)">+</button>

    </div>
  `;

  contenedor.appendChild(div);

});

function cambiarCantidad(indice, cambio) {

  carrito[indice] += cambio;

  if (carrito[indice] < 0) {
    carrito[indice] = 0;
  }

  document.getElementById("cantidad-" + indice).textContent =
    carrito[indice];

  actualizarCarrito();
}

function actualizarCarrito() {

  const lista = document.getElementById("lista-carrito");

  let total = 0;
  let texto = "";

  productos.forEach((producto, indice) => {

    const cantidad = carrito[indice];

    if (cantidad > 0) {

      const nombre = producto[0];
      const precio = producto[1];
      const subtotal = cantidad * precio;

      total += subtotal;

      texto += `
        <p>
          ${cantidad} × ${nombre}
          — $${subtotal}
        </p>
      `;
    }

  });

  if (texto === "") {
    lista.innerHTML = "<p>Aún no has agregado productos.</p>";
  } else {
    lista.innerHTML = texto;
  }

  document.getElementById("total").textContent = total;
}

document.getElementById("btn-whatsapp").addEventListener("click", () => {

  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();

  if (!nombre) {
    alert("Escribe tu nombre.");
    return;
  }

  if (!telefono) {
    alert("Escribe tu teléfono.");
    return;
  }

  let mensaje = "🌽 *NUEVO PEDIDO — ELOTEMANÍA*%0A%0A";

  mensaje += "*Cliente:* " + nombre + "%0A";
  mensaje += "*Teléfono:* " + telefono + "%0A%0A";

  let total = 0;
  let hayProductos = false;

  productos.forEach((producto, indice) => {

    const cantidad = carrito[indice];

    if (cantidad > 0) {

      hayProductos = true;

      const nombreProducto = producto[0];
      const precio = producto[1];
      const subtotal = cantidad * precio;

      total += subtotal;

      mensaje +=
        "🌽 " + cantidad + " × " +
        nombreProducto +
        " — $" + subtotal +
        "%0A";
    }

  });

  if (!hayProductos) {
    alert("Agrega al menos un producto.");
    return;
  }

  mensaje += "%0A*TOTAL: $" + total + "*%0A%0A";
  mensaje += "¡Gracias por tu pedido! 🌽🔥";

  const url =
    "https://wa.me/" + WHATSAPP +
    "?text=" + mensaje;

  window.location.href = url;

});


/* INSTALACIÓN ANDROID */

let deferredPrompt = null;

const botonInstalar =
  document.getElementById("btn-instalar");

window.addEventListener("beforeinstallprompt", (evento) => {

  evento.preventDefault();

  deferredPrompt = evento;

  botonInstalar.style.display = "inline-block";

});


botonInstalar.addEventListener("click", async () => {

  if (!deferredPrompt) {
    return;
  }

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;

  botonInstalar.style.display = "none";

});


/* INSTRUCCIONES IPHONE */

const esIOS =
  /iphone|ipad|ipod/i.test(navigator.userAgent);

const estaEnModoApp =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

if (esIOS && !estaEnModoApp) {
  document.getElementById("ios").style.display = "block";
}


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("/sw.js?v=5")
      .then(() => {
        console.log("Elotemanía: servicio instalado");
      })
      .catch((error) => {
        console.log("Service Worker:", error);
      });

  });

}

</script>

</body>
</html>
